name: Build Native Android Preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and lint native app
        working-directory: native-android
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CareLink-Native-Preview-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
