<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOMAMO Medical Case Management</title><style>:root{--nav:#123b36;--teal:#087d6e;--mint:#e8f5f1;--bg:#f4f7f6;--ink:#19302c;--muted:#71817d;--line:#dfe9e5;--red:#cf4e4b;--amber:#a96f16}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#e5f2ee,#f8faf9)}.login-card{width:390px;background:#fff;padding:38px;border-radius:16px;box-shadow:0 18px 60px #143b351c;border:1px solid var(--line)}.logo{display:flex;gap:12px;align-items:center;margin-bottom:30px}.logo-mark{width:42px;height:42px;border-radius:12px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px}.logo b{display:block;letter-spacing:.12em}.logo small{color:var(--muted)}h1{font-size:26px;margin:0 0 7px;letter-spacing:-.04em}.login p{color:var(--muted);margin:0 0 24px}.label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:16px 0 6px}.input,.select,.textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff;color:var(--ink);outline:0}.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #087d6e16}.primary{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:11px 15px;font-weight:700}.full{width:100%}.login-note{font-size:11px;background:#f3f8f6;color:#55706a;border-radius:8px;padding:10px;margin-top:17px}.error{color:var(--red);font-size:12px;margin-top:8px}.shell{display:flex;min-height:100vh}.side{width:245px;background:var(--nav);color:#d8e8e4;padding:22px 13px;position:fixed;inset:0 auto 0 0}.brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px}.brand .logo-mark :space-between;align-items:center}.card-head b{font-size:13px}.card-body{padding:16px}.alert{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf2f0}.alert:last-child{border-bottom:0}.bullet{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:5px}.bullet.amber{background:#dfa033}.alert strong{font-size:12px}.alert small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.go{margin-left:auto;color:var(--teal);font-size:11px;font-weight:700}.searchbar{display:flex;gap:8px;margin-bottom:15px}.searchbar .input{max-width:310px}.table{width:100%;border-collapse:collapse}.table th{background:#fbfcfc;text-align:left;color:#81908c;font-size:10px;text-transform:uppercase;padding:11px 14px;border-bottom:1px solid var(--line)}.table td{padding:12px 14px;border-bottom:1px solid #edf2f0;font-size:12px}.patient{display:flex;align-items:center;gap:8px}.patient small{display:block;color:var(--muted);font-size:10px}.pill{padding:4px 7px;border-radius:5px;background:#e6f4ef;color:#267966;font-size:10px;font-weight:700}.pill.red{background:#fff0ee;color:var(--red)}.pill.amber{background:#fff4df;color:var(--amber)}.modal-bg{position:fixed;inset:0;background:#102f2b85;display:grid;place-items:center;z-index:4}.modal{width:min(820px,calc(100% - 30px));max-height:92vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 80px #0004}.modal-head{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f0f4f2;border-radius:6px;width:28px;height:28px}.modal-body{padding:19px 22px}.modal-foot{padding:13px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.stepper{display:flex;gap:5px;margin-bottom:20px}.step{flex:1;padding:9px 7px;background:#eef3f1;color:#687a75;border-radius:6px;text-align:center;font-size:11px}.step.active{background:var(--mint);color:var(--teal);font-weight:700}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:17px}.section:first-child{border:0;padding-top:0;margin-top:0}.section h3{font-size:13px;color:var(--teal);margin:0 0 4px}.section p{color:var(--muted);font-size:11px;margin:0 0 13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}.checkgrid{display:flex;flex-wrap:wrap;gap:7px}.check{padding:8px 10px;background:#f4f8f6;border:1px solid var(--line);border-radius:6px;font-size:11px}.check input{accent-color:var(--teal)}.timeline{padding-left:20px;border-left:2px solid #d9eae5}.event{padding:0 0 18px;position:relative}.event:before{content:'';position:absolute;left:-26px;top:3px;width:8px;height:8px;border:2px solid var(--teal);background:#fff;border-radius:50%}.event strong{font-size:12px}.event small{display:block;color:var(--muted);font-size:10px;margin:3px 0}.event p{font-size:11px;margin:0;color:#526660}.report{background:#fff;padding:30px;max-width:780px;margin:auto}.report h1{border-bottom:2px solid var(--teal);padding-bottom:12px}.report h2{font-size:14px;color:var(--teal);margin-top:25px}.report table{width:100%;border-collapse:collapse}.report td{padding:7px;border-bottom:1px solid var(--line);font-size:12px}.toast{position:fixed;right:25px;bottom:25px;background:#173f39;color:#fff;padding:13px 17px;border-radius:8px;display:none;z-index:8;font-size:12px}.toast.show{display:block}@media(max-width:850px){.side{width:200px}.main{margin-left:200px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.side{display:none}.main{margin:0}.page{padding:18px 14px}.top{padding:0 15px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.head{display:block}.actions{margin-top:13px}.cards{gap:8px}.metric{padding:12px}.metric b{font-size:23px}}
</style></head><body><div id="app"></div><script>const patients=[{id:'LM-0248',name:'Achieng Odhiambo',sex:'Female',area:'Manyatta',branch:'Kisumu',status:'Home-based care',risk:'High',initials:'AO'},{id:'LM-0241',name:'Otieno Ouma',sex:'Male',area:'Mbita',branch:'Homa Bay',status:'Hospitalized',risk:'Critical',initials:'OO'},{id:'LM-0237',name:'Atieno Akinyi',sex:'Female',area:'Kondele',branch:'Kisumu',status:'Improving',risk:'Moderate',initials:'AA'},{id:'LM-0229',name:'Moses Onyango',sex:'Male',area:'Rusinga',branch:'Homa Bay',status:'Stable',risk:'Low',initials:'MO'}];
let selected=patients[0];let page='dashboard';function loadLocal(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}let savedVisits=loadLocal('lomamo_saved_visits',[]);let savedRecords=loadLocal('lomamo_saved_records',[]);let savedAppointments=loadLocal('lomamo_saved_appointments',[]);
patients.forEach((p,i)=>p.programStatus=['Active in program','Active in program','Recovered and discharged','Discharged before recovery'][i]||'Active in program');
const nav=[['dashboard','⌂','Dashboard'],['patients','♙','Patients'],['visits','▣','Hospital visits'],['appointments','◷','Bookings & appointments'],['pharmacy','▥','Pharmacy purchases'],['medicalreports','▤','Medical reports'],['emergency','!','Emergency'],['followup','↻','Follow-up'],['inventory','▤','Medical inventory'],['directories','⌘','Master directories'],['archive','▱','Archive'],['coordination','♧','Areas & coordinators'],['ai','✦','AI assistance'],['settings','⚙','Settings'],['reports','▥','Reports & research']];
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="login-card"><div class="logo"><div class="logo-mark">L</div><div><b>LOMAMO</b><small>Medical Case Management</small></div></div><h1>Sign in</h1><p>Secure access for authorized LOMAMO staff.</p><label class="label">Username</label><input id="user" class="input" value="medical.admin"><label class="label">Password</label><input id="pass" type="password" class="input" placeholder="LOMAMO2026" onkeydown="if(event.key==='Enter')authenticate()"><div id="err"></div><button class="primary full" style="margin-top:20px" onclick="authenticate()">Sign in securely</button><button class="btn full" style="margin-top:9px" onclick="showAdminSetup()">First-time administrator setup</button><div class="login-note">Demo access: <b>medical.admin</b> / <b>LOMAMO2026</b><br>Production deployment must replace this demo gate with server-side authentication, MFA and encrypted storage.</div></div></div>`}
function showAdminSetup(){document.getElementById('app').innerHTML=`<div class="login"><div class="login-card"><div class="logo"><div class="logo-mark">L</div><div><b>LOMAMO</b><small>Secure first-time setup</small></div></div><h1>Create administrator</h1><p>Use this once on the secure server. Create a unique password of at least 12 characters.</p><label class="label">Username</label><input id="setupUser" class="input" placeholder="administrator username"><label class="label">Password</label><input id="setupPass" type="password" class="input" placeholder="At least 12 characters"><label class="label">Confirm password</label><input id="setupPass2" type="password" class="input"><div id="setupErr"></div><button class="primary full" style="margin-top:20px" onclick="createAdmin()">Create administrator</button><button class="btn full" style="margin-top:9px" onclick="login()">Back to sign in</button></div></div>`}
async function createAdmin(){const username=document.getElementById('setupUser').value, password=document.getElementById('setupPass').value, p2=document.getElementById('setupPass2').value;if(password!==p2){document.getElementById('setupErr').innerHTML='<div class="error">Passwords do not match.</div>';return}if(location.protocol!=='http:'||location.port!=='5000'){document.getElementById('setupErr').innerHTML='<div class="error">First-time setup is available only through the secure server.</div>';return}const r=await fetch('/api/setup/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,display_name:'LOMAMO Medical Team'})});if(r.ok){alert('Administrator created. Sign in now.');login()}else{const e=await r.json();document.getElementById('setupErr').innerHTML='<div class="error">'+(e.error||'Setup failed')+'</div>'}}
async function authenticate(){const u=document.getElementById('user').value.trim();const pw=document.getElementById('pass').value.trim();const err=document.getElementById('err');if(location.protocol==='http:'&&location.port==='5000'){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:pw})});if(r.ok){const data=await r.json();window.lomamoSignedIn=true;window.lomamoServerUser=data;branchChoice();return}const e=await r.json();err.innerHTML='<div class="error">'+(e.error||'Login failed')+'</div>';return}catch(e){err.innerHTML='<div class="error">Secure server is unavailable.</div>';return}}if((u==='medical.admin'||u==='admin')&&(pw==='LOMAMO2026'||pw==='lomamo2026')){window.lomamoSignedIn=true;branchChoice()}else err.innerHTML='<div class="error">Login not recognized.</div>'}
function branchChoice(){const allowed=window.lomamoServerUser&&window.lomamoServerUser.branch&&window.lomamoServerUser.branch!=='All'?[window.lomamoServerUser.branch]:['Kisumu','Homa Bay'];document.getElementById('app').innerHTML=`<div class="login"><div class="login-card" style="width:560px"><div class="logo"><div class="logo-mark">L</div><div><b>LOMAMO</b><small>Medical Case Management</small></div></div><h1>Select branch</h1><p>Choose the approved branch workspace. Branch users cannot access data outside their assigned branch.</p><div style="display:grid;grid-template-columns:repeat(${allowed.length},1fr);gap:12px;margin-top:20px">${allowed.map(b=>`<button class="btn" style="padding:24px;text-align:left" onclick="chooseBranch('${b}')"><b style="display:block;font-size:16px;color:var(--teal)">${b}</b><small>${b==='Kisumu'?'Nyahera · Chiga · Ombeyi · Ahero · Manyatta · Nyalenda · Nairobi Road':'Sub-county-based patient and coordinator workspace'}</small></button>`).join('')}</div><div class="login-note">Access is limited to your approved branch.</div></div></div>`}
function chooseBranch(branch){window.lomamoBranch=branch;shell()}
function shell(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="logo-mark">L</div><div><b>LOMAMO</b><small>Medical Case Management</small></div></div><div class="side-label">WORKSPACE</div>${nav.map(n=>`<div class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</div>`).join('')}<div class="side-label">ACCOUNT</div><div class="nav" onclick="logout()"><span>↪</span>Sign out</div><div class="side-foot"><b>LOMAMO Medical Team</b><small>Head of Medical · All branches</small></div></aside><main class="main"><header class="top"><span class="crumb">LOMAMO Foundation / ${window.lomamoBranch} branch / ${pageTitle()}</span><div class="user"><button class="btn" onclick="showNotifications()">🔔 ${savedAppointments.length}</button><button class="btn" onclick="branchChoice()">${window.lomamoBranch} ⌄</button><span>Secure session · 29 min</span><div class="avatar">AO</div><b>LOMAMO Team</b></div></header><div id="page" class="page"></div></main></div><div id="toast" class="toast"></div><div id="modal"></div>`;renderPage()}
function pageTitle(){return page==='visits'?'Hospital workflow':page[0].toUpperCase()+page.slice(1)}function go(x){page=x;shell()}function logout(){window.lomamoSignedIn=false;window.lomamoBranch='';login()}
function render(){window.lomamoSignedIn?(window.lomamoBranch?shell():branchChoice()):login()}
function head(title,sub,buttons=''){return `<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`}
function renderPage(){let x='';if(page==='dashboard')x=dashboard();else if(page==='patients')x=patientsPage();else if(page==='visits')x=visitsPage();else x=modulePage();document.getElementById('page').innerHTML=x;bind()}
function dashboard(){return head('Good morning, LOMAMO Team','Clinical workload across Kisumu and Homa Bay.',`<button class="btn red" onclick="go('emergencybookings')">🚨 Emergency</button><button class="primary" onclick="newVisit()">＋ Hospital visit</button>`)+`<div class="cards"><div class="card metric"><small>Active patients</small><b>128</b><i>↗ 8.4% this month</i></div><div class="card metric"><small>Action required</small><b>16</b><i style="color:var(--red)">4 emergencies</i></div><div class="card metric"><small>Hospitalized</small><b>7</b><i>2 fewer than last week</i></div><div class="card metric"><small>Follow-ups due</small><b>9</b><i style="color:var(--amber)">4 overdue</i></div></div><div class="grid"><div class="card"><div class="card-head"><b>Action required</b><span class="muted">Today · 22 Sep 2026</span></div><div class="card-body"><div class="alert"><i class="bullet"></i><div><strong>Critical emergency · Otieno Ouma</strong><small>Difficulty breathing · Homa Bay · reported 18 min ago</small></div><span class="go" onclick="openEmergency()">Review →</span></div><div class="alert"><i class="bullet"></i><div><strong>Hospital visit report awaiting approval</strong><small>Atieno Akinyi · CCC/HIV clinic · Kisumu</small></div><span class="go" onclick="showReport()">Open →</span></div><div class="alert"><i class="bullet amber"></i><div><strong>Overdue follow-up · 4 patients</strong><small>Due between 19–21 Sep · coordinator action</small></div><span class="go">Open →</span></div></div></div><div class="card"><div class="card-head"><b>Branch census</b><span class="muted">Active patients</span></div><div class="card-body"><div class="alert"><div><strong>Kisumu</strong><small>Home-based 45 · Outpatient 23 · Hospital 4</small></div><b class="go">82</b></div><div class="alert"><div><strong>Homa Bay</strong><small>Home-based 25 · Outpatient 14 · Hospital 3</small></div><b class="go">46</b></div><div class="alert"><div><strong>Ready for discharge</strong><small>Clinically stable and planned support complete</small></div><b class="go">5</b></div></div></div></div>`}
function patientRows(){return patients.map(p=>`<tr><td><div class="patient"><div class="avatar">${p.initials}</div><div><b>${p.name}</b><small>${p.id} · ${p.programStatus||'Active in program'}</small></div></div></td><td>${p.sex}</td><td>${p.area} · ${p.branch}</td><td><span class="pill ${p.status==='Hospitalized'?'red':''}">${p.status}</span></td><td><span class="pill ${p.risk==='Critical'?'red':p.risk==='High'?'amber':''}">${p.risk}</span></td><td><button class="btn" onclick="openPatient('${p.id}')">Open record</button></td></tr>`).join('')}
function patientsPage(){return head('Patients','One patient record, one clinical timeline, many automatic outputs.',`<button class="primary" onclick="newPatient()">＋ New patient</button>`)+`<div class="searchbar"><input class="input" id="search" placeholder="Search patient name, ID, area..."><select class="select"><option>All branches</option><option>Kisumu</option><option>Homa Bay</option></select></div><div class="card"><div class="card-head"><b>Patient register</b><span class="muted">128 records · access controlled</span></div><table class="table"><thead><tr><th>Patient</th><th>Sex</th><th>Area / branch</th><th>Current status</th><th>Risk</th><th></th></tr></thead><tbody id="rows">${patientRows()}</tbody></table></div>`}
function openPatient(id){selected=patients.find(p=>p.id===id)||patients[0];document.getElementById('page').innerHTML=head('Patient record',`${selected.id} · ${selected.area}, ${selected.branch}`,`<button class="btn" onclick="showReport()">Generate medical report</button><button class="primary" onclick="newVisit()">＋ Hospital visit</button>`)+`<div class="grid"><div class="card"><div class="card-head"><b>${selected.name}</b><span class="pill">${selected.status}</span></div><div class="card-body"><div class="alert"><div><strong>Patient identification</strong><small>Sex: ${selected.sex} · Area: ${selected.area} · Branch: ${selected.branch}</small></div></div><div class="alert"><div><strong>Clinical overview</strong><small>HIV/TB clinical details are shown only to authorized medical staff. Current risk: ${selected.risk}.</small></div></div><button class="btn red" onclick="openEmergency()">🚨 Report emergency</button></div></div><div class="card"><div class="card-head"><b>Clinical timeline</b><span class="muted">Linked records</span></div><div class="card-body timeline"><div class="event"><strong>Home follow-up · Stable</strong><small>22 Sep 2026 · Area coordinator</small><p>Continuing current treatment. Follow-up scheduled.</p></div><div class="event"><strong>Hospital visit · CCC/HIV clinic</strong><small>14 Sep 2026 · Jaramogi Oginga Odinga Teaching & Referral Hospital</small><p>Viral load requested. Treatment continued. Review booked.</p></div>${savedVisits.map(v=>`<div class="event"><strong>Hospital visit · ${v.diagnosis}</strong><small>${v.date} · ${v.hospital}</small><p>${v.plan}</p></div>`).join('')}</div></div></div>`}
function visitsPage(){return head('Hospital workflow','Create a complete medical encounter once. The system links it to the patient, follow-up and report.',`<button class="primary" onclick="newVisit()">＋ New hospital visit</button>`)+`<div class="card"><div class="card-head"><b>Recent hospital encounters</b><span class="muted">Draft → review → approved → final</span></div><table class="table"><thead><tr><th>Patient</th><th>Facility / service</th><th>Diagnosis</th><th>Outcome</th><th>Report</th></tr></thead><tbody>${[['Otieno Ouma','Homa Bay County Referral · TB clinic','Tuberculosis','Admitted','Pending approval'],['Atieno Akinyi','JOOTRH · CCC/HIV clinic','HIV disease','Returned home','Approved'],['Achieng Odhiambo','JOOTRH · Wound clinic','Wound infection','Booked review','Draft']].map((r,i)=>`<tr><td><b>${r[0]}</b><small class="muted"> 22 Sep 2026</small></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="pill ${r[3]==='Admitted'?'red':''}">${r[3]}</span></td><td><button class="btn" onclick="showReport()">${r[4]}</button></td></tr>`).join('')}</tbody></table></div>`}
function modulePage(){if(page==='coordination')return coordinationPage();if(page==='reports')return analysisReportsPage();if(page==='inventory')return inventoryPage();if(page==='appointments')return appointmentsPage();if(page==='directories')return directoriesPage();if(page==='pharmacy')return pharmacyPage();if(page==='medicalreports')return medicalReportsPage();let titles={emergency:['Emergency cases','Initial alerts are not definitive triage decisions. Medical review is required.','Report emergency'],followup:['Follow-up','Automatically generated tasks from hospital visits, emergencies, wounds and referrals.','＋ Follow-up'],inventory:['Medical inventory','Branch balances, low stock, expiry and FEFO issue control.','＋ Stock in'],reports:['Reports & research','Weekly and monthly reports compile from saved clinical records.','Generate report']}[page]||['Module','Structured workflow for LOMAMO medical case management.','＋ New record'];return head(titles[0],titles[1],`<button class="primary" onclick="${page==='emergency'?'openEmergency()':'newVisit()'}">${titles[2]}</button>`)+`<div class="card"><div class="card-head"><b>${titles[0]} queue</b><span class="muted">Role-controlled view</span></div><div class="card-body">${['Otieno Ouma','Achieng Odhiambo','Atieno Akinyi','Moses Onyango'].map((n,i)=>`<div class="alert"><i class="bullet ${i>1?'amber':''}"></i><div><strong>${n}</strong><small>${page==='emergency'?'Medical review required':'Updated today'} · ${i%2?'Homa Bay':'Kisumu'}</small></div><span class="go">Open →</span></div>`).join('')}</div></div>`}

function visitForm(){let checks=a=>`<div class="checkgrid">${a.map(x=>`<label class="check"><input type="checkbox"> ${x}</label>`).join('')}</div>`;return `<div class="stepper"><div class="step active">1 Encounter</div><div class="step active">2 Complaints</div><div class="step active">3 Investigations</div><div class="step active">4 Diagnosis</div><div class="step active">5 Plan</div></div><div class="section"><h3>Encounter details</h3><p>Facility and encounter information automatically link to the patient timeline.</p><div class="formgrid"><div><label class="label">Patient</label><input id="vpatientName" class="input" list="visitPatientList" placeholder="Type patient name..." value="${selected.name}"><datalist id="visitPatientList">${patients.map(p=>`<option value="${p.name}">${p.id}</option>`).join('')}</datalist></div><div><label class="label">Branch</label><select id="visitBranch" class="select" onchange="updateVisitAreas()"><option>Kisumu</option><option>Homa Bay</option></select></div><div><label class="label">Area / sub-county</label><select id="visitArea" class="select">${branchAreaOptions()}</select></div><div><label class="label">Date</label><input id="vdate" type="date" class="input" value="2026-09-22"></div><div><label class="label">Hospital</label><input id="vhospital" class="input" list="hospitalList" placeholder="Search hospital or type a new one..."><datalist id="hospitalList">${hospitalDatalist()}</datalist></div><div><label class="label">Department / clinic</label><select id="vdepartment" class="select">${departmentOptions()}</select></div><div><label class="label">Clinic / service</label><select id="vclinic" class="select">${clinicOptions()}</select></div></div></div><div class="section"><h3>Chief complaints by body system</h3><p>Choose a system first, then select one or more presenting complaints. These are complaints, not diagnoses.</p><div class="formgrid"><div><label class="label">Body system</label><select id="vSystem" class="select" onchange="updateComplaintChoices()"><option>Respiratory</option><option>Gastrointestinal</option><option>Urinary / renal</option><option>Neurological</option><option>Cardiovascular</option><option>Musculoskeletal</option><option>Skin / wound</option><option>General / constitutional</option><option>Eye, ear, nose and throat</option><option>Mental health / behavioural</option><option>Reproductive / sexual health</option><option>Haematology / bleeding</option><option>HIV/TB-related symptoms</option><option>Emergency / injury</option></select></div><div><label class="label">Duration / severity</label><input class="input" placeholder="e.g. 3 weeks · moderate"></div></div><label class="label">Specific complaints</label><div id="complaintChoices" class="checkgrid">${complaintChoices()}</div><label class="label">Clinical findings linked to selected complaints</label><div id="clinicalFindingChoices" class="checkgrid"><span class="muted">Select complaints above to see related findings.</span></div><textarea id="vfindings" class="textarea" placeholder="Add clinician findings not represented above..."></textarea></div><div class="section"><h3>Investigations</h3><p>Record laboratory, radiology and histology/pathology separately.</p><div class="formgrid"><div class="field full"><label class="label">Laboratory tests — select all that apply</label><div class="checkgrid">${investigationChecks(laboratoryCatalogue,'laboratory')}</div></div><div class="field full"><label class="label">Imaging / radiology — select all that apply</label><div class="checkgrid">${investigationChecks(imagingCatalogue,'radiology')}</div></div><div class="field full"><label class="label">Histology / pathology — select all that apply</label><div class="checkgrid">${investigationChecks(pathologyCatalogue,'pathology')}</div></div><div><label class="label">Result status</label><select class="select"><option>Pending</option><option>Normal</option><option>Abnormal</option><option>Positive</option><option>Negative</option></select><label class="label">Results / interpretation</label><textarea class="textarea"></textarea></div></div></div><div class="section"><h3>LOMAMO primary programme diagnosis and treatment</h3><p>Every LOMAMO-supported patient must have one primary programme diagnosis. Select HIV/AIDS, TB or both, then link the current treatment context.</p><div class="formgrid"><div><label class="label">Primary LOMAMO diagnosis</label><select id="primaryProgrammeDiagnosis" class="select"><option value="">Select required primary diagnosis...</option><option>HIV/AIDS</option><option>Tuberculosis (TB)</option><option>HIV/AIDS and Tuberculosis (TB)</option></select></div><div><label class="label">Treatment status</label><select class="select"><option>Currently on treatment</option><option>Starting treatment</option><option>Treatment interrupted</option><option>Completed treatment</option><option>Not recorded</option></select></div><div class="field full"><label class="label">Treatment currently received — select all that apply</label><div class="checkgrid">${['ART / antiretroviral treatment','TB treatment','TB preventive treatment','Adherence counselling','HIV viral-load monitoring','CD4 monitoring','TB treatment monitoring','Opportunistic-infection prophylaxis','Nutrition support','Other treatment support'].map(x=>`<label class="check"><input type="checkbox" name="programmeTreatment" value="${x}" onchange="toggleOtherField(this)"> ${x}</label>`).join('')}</div></div><div><label class="label">Current regimen / medicines</label><select class="select" multiple>${medicineOptions()}</select></div><div><label class="label">Adherence / treatment concern</label><select class="select"><option>No concern recorded</option><option>Good adherence</option><option>Missed doses</option><option>Side effects</option><option>Medicine unavailable</option><option>Needs clinician review</option></select></div></div></div><div class="section"><h3>Additional diagnosis</h3><p>Keep suspected and clinician-confirmed additional diagnoses distinct.</p><div class="formgrid"><div><label class="label">Diagnosis</label><div id="diagnosisChoices" class="checkgrid">${diseaseChecks()}</div></div><div><label class="label">Certainty</label><select class="select"><option>Clinician-confirmed</option><option>Suspected</option><option>Ruled out</option></select></div></div></div><div class="section"><h3>Treatment plan and recommendations</h3><p>AI may draft; an authorized clinician reviews before approval.</p>${treatmentActionChecks()}<div id="treatmentMedicationFields" style="display:none;margin-top:12px"><label class="label">Medication — select all that apply</label><div class="checkgrid">${investigationChecks(medicineCatalogue,'treatmentMedicine')}</div><label class="label">Medication instructions / changes</label><textarea class="textarea" placeholder="Dose, route, frequency, duration or reason for change..."></textarea></div><div id="specialistFields" style="display:none;margin-top:12px"><label class="label">Specialist — select all that apply</label><div class="checkgrid">${investigationChecks(specialistCatalogue,'specialist')}</div><label class="label">Specialist reason</label><input class="input" placeholder="Reason for specialist review..."></div><div id="referralFields" style="display:none;margin-top:12px"><label class="label">Referral hospital / facility</label><input class="input" list="referralHospitalList" placeholder="Search referral hospital or type a new one..."><datalist id="referralHospitalList">${hospitalDatalist()}</datalist><label class="label">Referral reason</label><textarea class="textarea" placeholder="Reason and urgency..."></textarea><label class="check"><input type="checkbox" onchange="document.getElementById('referralOther').style.display=this.checked?'block':'none'"> Facility not in list</label><input id="referralOther" style="display:none;margin-top:7px" class="input" placeholder="Type facility name and location..."></div><div id="admissionFields" style="display:none;margin-top:12px"><div class="formgrid"><div><label class="label">Ward type</label><select class="select"><option>Medical ward</option><option>Surgical ward</option><option>TB / isolation ward</option><option>HIV / infectious diseases ward</option><option>Paediatric ward</option><option>Maternity ward</option><option>Gynaecology ward</option><option>Orthopaedic ward</option><option>High dependency unit</option><option>Intensive care unit</option><option>Private ward</option><option>Other ward</option></select></div><div><label class="label">Date of admission</label><input class="input" type="date" value="2026-09-22"></div></div><label class="label">Admission notes</label><textarea class="textarea" placeholder="Reason for admission and immediate plan..."></textarea></div><div class="formgrid"><div><label class="label">HIV / ART care plan</label><select class="select"><option>Not applicable / not recorded</option><option>Continue ART</option><option>ART adherence counseling</option><option>ART review required</option><option>Refer to CCC</option></select></div><div><label class="label">TB care plan</label><select class="select"><option>Not applicable / not recorded</option><option>Continue TB treatment</option><option>TB adherence counseling</option><option>TB review required</option><option>Refer to TB clinic</option></select></div><div><label class="label">Next follow-up / booking date</label><input id="vnextFollowup" class="input" type="date" value="2026-09-29"></div><div><label class="label">Outcome</label><select class="select"><option>Treated and returned home</option><option>Admitted</option><option>Referred</option><option>Booked for review</option></select></div><div class="field full"><label class="label">Recommendations / safety-net advice</label><textarea id="vplan" class="textarea" placeholder="Advice, warning signs, adherence or referral plan..."></textarea></div></div></div>`}
function modal(title,body,message,visit=false){document.getElementById('modal').innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div style="background:#fff8e8;border:1px solid #f1e1b8;padding:10px;border-radius:7px;font-size:11px;color:#80651f;margin-bottom:15px">Sensitive clinical data. Access, editing and report approval must be enforced server-side in production.</div>${body}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveRecord(${visit})">Save ${visit?'visit':'record'}</button></div></div></div>`;window.modalMessage=message}
function showNotifications(){const due=savedAppointments.filter(a=>a.status!=='completed');if(!due.length){toast('No pending booking notifications');return}alert('Booking reminders\n\n'+due.map(a=>a.patient+' — '+a.hospital+' — '+a.date+' '+a.time).join('\n'))}
function saveRecord(visit){if(visit){const record={id:'VIS-'+Date.now(),date:document.getElementById('vdate')?.value||new Date().toISOString().slice(0,10),patient:document.getElementById('vpatientName')?.value||selected.name,branch:document.getElementById('visitBranch')?.value||'',area:document.getElementById('visitArea')?.value||'',hospital:document.getElementById('vhospital')?.value||'',department:document.getElementById('vdepartment')?.value||'',clinic:document.getElementById('vclinic')?.value||'',diagnosis:[...document.querySelectorAll('input[name=\"diagnosis\"]:checked')].map(x=>x.value),plan:document.getElementById('vplan')?.value||'Treatment plan and recommendations recorded.',savedAt:new Date().toISOString()};savedVisits.push(record);saveLocal('lomamo_saved_visits',savedVisits);const next=document.getElementById('vnextFollowup')?.value;if(next){savedAppointments.push({id:'APT-'+Date.now(),patient:record.patient,hospital:record.hospital,department:record.department,clinic:record.clinic,date:next,time:'09:00',reason:'Follow-up from hospital visit',status:'upcoming',reminder:'1 day before'});saveLocal('lomamo_saved_appointments',savedAppointments)}}else if(window.modalContext==='appointment'){savedAppointments.push({id:'APT-'+Date.now(),patient:document.getElementById('appointmentPatient')?.value||selected.name,hospital:document.getElementById('appointmentHospital')?.value||'',department:document.getElementById('appointmentDepartment')?.value||'',clinic:document.getElementById('appointmentClinic')?.value||'',date:document.getElementById('appointmentDate')?.value||'',time:document.getElementById('appointmentTime')?.value||'',reason:'Hospital appointment',status:'upcoming',reminder:'Selected reminder'});saveLocal('lomamo_saved_appointments',savedAppointments);window.modalContext=''}else{savedRecords.push({id:'REC-'+Date.now(),savedAt:new Date().toISOString(),message:window.modalMessage});saveLocal('lomamo_saved_records',savedRecords)}closeModal();toast(window.modalMessage+' · saved locally');if(visit){page='visits';renderPage()}}
function closeModal(){document.getElementById('modal').innerHTML=''}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function showReport(){let p=selected;document.getElementById('modal').innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h2>Detailed medical report · Draft</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="report"><h1>LOMAMO Foundation</h1><p><b>Detailed Medical Case Management Report</b><br>Draft · Requires authorized clinician review and approval</p><h2>1. Patient identification</h2><table><tr><td>Patient</td><td><b>${p.name}</b> (${p.id})</td></tr><tr><td>Sex</td><td>${p.sex}</td></tr><tr><td>Branch / area</td><td>${p.branch} / ${p.area}</td></tr><tr><td>Coordinator/caregiver</td><td>Linked according to area assignment</td></tr><tr><td>Contact</td><td>Information not available in the current record.</td></tr></table><h2>2. Programme and clinical background</h2><p>${p.name} is supported by LOMAMO Foundation and is enrolled under the HIV/TB programme. Primary HIV/TB status, treatment history, adherence information and current ARV/TB regimen must be confirmed from the patient record before final approval. Past medical history and family history are recorded only where entered by authorized staff.</p><h2>3. Reason for hospital visit</h2><p>The patient attended/requires hospital review for documented chief complaints selected by body system. The current draft records follow-up and weakness. Additional complaints, duration, severity and associated symptoms should be confirmed from the saved encounter.</p><h2>4. Clinical findings</h2><p>Clinical findings should be compiled from the findings selected for the complaints, including relevant observations, vital signs and examination findings. Information not available in the current record is not invented.</p><h2>5. Investigations</h2><h3>Laboratory</h3><p>Selected laboratory tests and results should appear here, including HIV viral load, CD4, GeneXpert/TB tests, FBC, renal and liver tests, cultures and other investigations. Result, interpretation, date and laboratory must be confirmed.</p><h3>Radiology / imaging</h3><p>Selected imaging, body site, indication, findings and impression should appear here. Information not available in the current record is not invented.</p><h3>Histology / pathology</h3><p>Selected biopsy, cytology, histopathology, FNAC or other pathology results should appear here with the report date and interpretation.</p><h2>6. Diagnoses</h2><p>Primary LOMAMO programme diagnosis: HIV/AIDS, TB or HIV/AIDS and TB — confirm from the saved patient record. Additional diagnoses should be listed with suspected, confirmed or ruled-out status and primary/secondary classification.</p><h2>7. Treatment plan</h2><p>The treatment plan should include medication started, continued or changed; dose, route, frequency and duration; procedures; wound care; admission; referrals; specialist review; nutrition; counselling and other active care. ARVs and TB medicines must be listed from the structured medication record.</p><h2>8. Hospital outcome</h2><p>Outcome should be recorded as treated and returned home, admitted, referred, specialist follow-up, booked for review or other documented outcome. Hospital visit does not automatically mean LOMAMO admission.</p><h2>9. Recommendations and safety-net advice</h2><p>Recommendations should include adherence instructions, danger signs, wound or symptom advice, referral instructions, medication advice and when to return urgently. Only clinician-approved recommendations should appear in the final report.</p><h2>10. Follow-up and bookings</h2><p>Next booking: 24 September 2026. The report should include hospital, department, clinic, date, time, reminder and responsible coordinator/caregiver. Missed and overdue appointments should be highlighted.</p><h2>11. LOMAMO support</h2><p>Documented support may include transport, pharmacy-direct purchases, SHA support, caregiver follow-up and other assistance. Independent inventory records remain separate from the medical report unless intentionally summarized by an authorized user.</p><h2>12. Authorship, review and approval</h2><table><tr><td>Prepared by</td><td><input class="input" placeholder="Enter name and role"></td></tr><tr><td>Date prepared</td><td>Enter date/time</td></tr><tr><td>Reviewed by</td><td><b>Washington Odero</b></td></tr><tr><td>Review date</td><td>Enter date/time</td></tr><tr><td>Approved by</td><td><b>Washington Odero</b></td></tr><tr><td>Approval date</td><td>Enter date/time</td></tr><tr><td>Status</td><td>Draft / Reviewed / Approved / Final</td></tr></table><p>AI assistance may help organize existing information but must not invent clinical data or make the final clinical decision. Washington Odero reviews and approves the final report.</p></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Close</button><button class="primary" onclick="window.print()">Print / Save PDF</button></div></div></div>`}
render();
</script></body></html>
